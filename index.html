<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Las Dos Caras: cada tema con sus dos perspectivas. Postura y contrapostura, siempre."
    />
    <title>Las Dos Caras</title>
    <script>
      ;(function () {
        var dark
        try {
          var raw = localStorage.getItem('lasdoscaras_theme')
          var stored = raw ? JSON.parse(raw).value : null
          dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        }
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
